version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    # eslint 10 runs with two package.json workarounds for
    # eslint-config-treesitter 1.0.2, which has had no release since
    # 2024-09 (upstream master still has the first defect):
    #   - `globals` is a direct devDependency. The config imports it
    #     without declaring it; eslint 9 supplied it transitively,
    #     eslint 10 does not, so config loading dies with
    #     ERR_MODULE_NOT_FOUND.
    #   - `overrides` moves the config's eslint-plugin-jsdoc from ^50
    #     to ^62. 50.x does not accept eslint 10 as a peer, so `npm ls`
    #     exits non-zero on ELSPROBLEMS. 62.x is the newest major that
    #     still supports Node 20, which the CI lint job runs (#62);
    #     63+ require Node 22. Update the override by hand.
    # Drop both once eslint-config-treesitter publishes a release that
    # declares `globals` and an eslint-10-compatible jsdoc plugin.

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - rust
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - go

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - python
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - swift
