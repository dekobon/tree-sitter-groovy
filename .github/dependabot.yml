version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - javascript
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Hold at major 9 until eslint-config-treesitter supports 10.
      # Verified against eslint 10.9.1 / eslint-config-treesitter 1.0.2:
      #   - Hard failure: the config imports `globals` without
      #     declaring it, relying on it being an eslint 9 transitive.
      #     eslint 10 no longer supplies it, so config loading dies
      #     with ERR_MODULE_NOT_FOUND before linting a single file.
      #   - Metadata failure: eslint-plugin-jsdoc@^50.x declares
      #     eslint 7-9, so eslint 10 leaves an invalid peer in the
      #     tree. `npm ci` still installs (npm nests and warns) but
      #     `npm ls` exits non-zero on ELSPROBLEMS.
      # Rule behavior itself is NOT a blocker — with `globals` present
      # eslint 10 reports byte-identical results to 9.39.5 on this
      # config, deprecated stylistic rules included. So the upgrade
      # buys no lint coverage; it only trades a supported peer graph
      # for an unsupported one. Lift this once the upstream config
      # declares `globals` and moves off eslint-plugin-jsdoc 50.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - rust
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - go

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - python
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - swift
