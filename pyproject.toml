[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dekobon-tree-sitter-groovy"
description = "Apache Groovy grammar for tree-sitter (dekobon fork)"
version = "0.3.0"
keywords = [
  "incremental",
  "parsing",
  "tree-sitter",
  "groovy",
  "jenkins",
  "gradle",
]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/dekobon/tree-sitter-groovy"

[project.optional-dependencies]
core = ["tree-sitter~=0.26"]

[tool.cibuildwheel]
build = "cp311-*"
build-frontend = "build"
# Run the binding tests against the freshly built wheel on every
# platform, so a wheel that imports but cannot parse -- the shape a
# missing src/scanner.c takes -- fails the build instead of shipping.
test-requires = ["tree-sitter~=0.26"]
test-command = "python -m unittest discover -s {project}/bindings/python/tests"
