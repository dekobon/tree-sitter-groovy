[package]
name = "dekobon-tree-sitter-groovy"
description = "Apache Groovy grammar for tree-sitter (dekobon fork)"
version = "0.6.0"
keywords = ["incremental", "parsing", "groovy", "jenkins", "gradle"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/dekobon/tree-sitter-groovy"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"

build = "bindings/rust/build.rs"
include = [
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "bindings/rust/**",
  "/grammar.js",
  "queries/*",
  "src/*",
  "test/stress/**",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "parse_stress"
path = "bindings/rust/tests/parse_stress.rs"

[[test]]
name = "incremental_reparse"
path = "bindings/rust/tests/incremental_reparse.rs"

[[test]]
name = "unterminated_comment_cost"
path = "bindings/rust/tests/unterminated_comment_cost.rs"

[[test]]
name = "scanner_keywords"
path = "bindings/rust/tests/scanner_keywords.rs"

[[test]]
name = "scanner_states"
path = "bindings/rust/tests/scanner_states.rs"

[[test]]
name = "name_argument_cost"
path = "bindings/rust/tests/name_argument_cost.rs"

[[test]]
name = "lambda_parameters_cost"
path = "bindings/rust/tests/lambda_parameters_cost.rs"

[[test]]
name = "statement_paren_cost"
path = "bindings/rust/tests/statement_paren_cost.rs"

[[test]]
name = "lambda_body_end_cost"
path = "bindings/rust/tests/lambda_body_end_cost.rs"

[[test]]
name = "multi_assignment_comma_cost"
path = "bindings/rust/tests/multi_assignment_comma_cost.rs"

[[test]]
name = "declaration_start_cost"
path = "bindings/rust/tests/declaration_start_cost.rs"

[[test]]
name = "relational_close_cost"
path = "bindings/rust/tests/relational_close_cost.rs"

[[test]]
name = "dotted_cast_type_cost"
path = "bindings/rust/tests/dotted_cast_type_cost.rs"

[[test]]
name = "slashy_string_cost"
path = "bindings/rust/tests/slashy_string_cost.rs"

[[test]]
name = "if_chain_cost"
path = "bindings/rust/tests/if_chain_cost.rs"

[[test]]
name = "dollar_slashy_string_cost"
path = "bindings/rust/tests/dollar_slashy_string_cost.rs"

[[test]]
name = "next_line_cast_cost"
path = "bindings/rust/tests/next_line_cast_cost.rs"

[[test]]
name = "literal_argument_cost"
path = "bindings/rust/tests/literal_argument_cost.rs"

[dependencies]
tree-sitter-language = "0.1.7"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27"

# Lint posture. No crate-wide allows — additional allows go at file or
# function level so the carve-out stays visible at the affected site
# rather than weakening the whole crate.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
